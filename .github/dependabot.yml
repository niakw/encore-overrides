# Only maintain GitHub Actions used by this repository.
# Game metadata, external emulator engines and pinned vendor snapshots are
# audited separately; Dependabot must never rewrite generated game records.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions)"
